[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/api
    --cov-report=term-missing
    --cov-report=html
    -m "not integration and not e2e"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that call real external APIs - skipped by default (run with 'pytest -m integration')
    e2e: marks end-to-end tests - skipped by default (run with 'pytest -m e2e')
    unit: marks unit tests
    auth: marks authentication tests
    projects: marks project tests
    games: marks games list/gallery tests

name: OpenAI plugin

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "services/plugin/**"
      - "plugins/tinyworlds/**"
      - ".agents/plugins/**"
      - "src/api/**"
      - "scripts/package_openai_plugin.py"
      - "requirements.txt"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies in the API environment
        run: |
          python -m pip install -r requirements.txt
          echo "TINYWORLDS_API_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install gateway dependencies separately
        run: |
          python -m venv /tmp/tinyworlds-plugin-tests
          /tmp/tinyworlds-plugin-tests/bin/pip install -r services/plugin/requirements-dev.txt
      - name: Verify real OAuth and MCP calls against a disposable API
        run: /tmp/tinyworlds-plugin-tests/bin/python -m pytest services/plugin/tests -o addopts= -q
      - name: Build development plugin package
        run: python scripts/package_openai_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: tinyworlds-plugin
          path: dist/tinyworlds-plugin.zip
